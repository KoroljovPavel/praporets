spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 64
  datasource:
    url: jdbc:postgresql://localhost:5432/praporets
    username: praporets
    password: praporets
  grpc:
    server:
      port: 9090
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # relay чекає ack від брокера: без acks=all «опубліковано»
      # означало б лише «прийнято в сокет»
      acks: all

praporets:
  grpc:
    heartbeat-interval: 15s
    revision-window: 500
  outbox:
    relay:
      enabled: true
      poll-interval: 200ms
      batch-size: 100


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
