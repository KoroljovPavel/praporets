spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 64
  datasource:
    url: jdbc:postgresql://localhost:5432/praporets
    username: praporets
    password: praporets
  grpc:
    server:
      port: 9090

praporets:
  grpc:
    heartbeat-interval: 15s
    revision-window: 500


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
