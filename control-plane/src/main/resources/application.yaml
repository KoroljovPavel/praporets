spring:
  threads:
    virtual:
      enabled: true
  # 04b/I4: graceful shutdown (дефолт Boot 4) затиснутий до 15s, щоб разом
  # із 3s gRPC-grace вписатися в terminationGracePeriodSeconds=30 деплойменту
  lifecycle:
    timeout-per-shutdown-phase: 15s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 64
  datasource:
    url: jdbc:postgresql://localhost:5432/praporets
    username: praporets
    password: praporets
  grpc:
    server:
      port: 9090
      # 04b/I4: StreamConfig-стріми вічні і самі не завершаться — з дефолтними
      # 30s КОЖЕН shutdown CP висів би повний grace. 3s: стріми обриваються,
      # edge перепідключається з backoff-ом (02d) — це його штатний режим
      shutdown:
        grace-period: 3s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # relay чекає ack від брокера: без acks=all «опубліковано»
      # означало б лише «прийнято в сокет»
      acks: all
    consumer:
      # історію знає Postgres (catch-up при конекті edge робить assembleSince);
      # консюмер fan-out потрібен тільки для live-змін — свіжа група не
      # перечитує компактований топік при старті репліки
      auto-offset-reset: latest

praporets:
  grpc:
    heartbeat-interval: 15s
    revision-window: 500
  outbox:
    relay:
      enabled: true
      poll-interval: 200ms
      batch-size: 100
  fanout:
    enabled: true
    # fan-out = кожна репліка отримує ВСІ повідомлення → унікальна група на
    # процес; покинуті групи Kafka прибирає за offsets.retention.minutes
    group-id: cp-fanout-${random.uuid}


management:
  # 04b: /actuator/health/{liveness,readiness} для k8s-probes. Boot вмикає їх
  # у k8s і сам (детекція KUBERNETES_SERVICE_HOST) — явний прапорець робить
  # поведінку однаковою в dev/тестах і прибирає «магію середовища»
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
