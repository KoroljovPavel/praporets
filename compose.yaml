services:
  postgres:
    image: postgres:17-alpine
    container_name: praporets-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: praporets
      POSTGRES_PASSWORD: praporets
      POSTGRES_DB: praporets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praporets -d praporets"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/dev/postgres-init:/docker-entrypoint-initdb.d:ro

  kafka:
    image: apache/kafka:4.1.0
    container_name: praporets-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # два listener-и: INTERNAL для майбутніх контейнерних клієнтів,
      # HOST — для сервісів, що бігають в IDE (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # топіки створює CP через KafkaAdmin — випадкових топіків не буде
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
    name: praporets_postgres_data
