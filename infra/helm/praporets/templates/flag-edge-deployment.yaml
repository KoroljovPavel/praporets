apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-edge
  labels:
    {{- include "praporets.labels" . | nindent 4 }}
      {{- include "praporets.selectorLabels" (dict "name" "flag-edge") | nindent 4 }}
spec:
  replicas: {{ .Values.flagEdge.replicas }}
  selector:
    matchLabels:
      {{- include "praporets.selectorLabels" (dict "name" "flag-edge") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "praporets.labels" . | nindent 8 }}
          {{- include "praporets.selectorLabels" (dict "name" "flag-edge") | nindent 8 }}
    spec:
      containers:
        - name: flag-edge
          image: {{ include "praporets.image" (dict "Values" .Values "name" "flag-edge") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.flagEdge.http.port }}
          # уся конфігурація середовища — одним envFrom із ConfigMap:
          # deployment не знає ІМЕН змінних, лише звідки їх узяти
          envFrom:
            - configMapRef:
                name: flag-edge-config
          env:
            - name: PRAPORETS_EDGE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
