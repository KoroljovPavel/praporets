apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "praporets.labels" . | nindent 4 }}
      {{- include "praporets.selectorLabels" (dict "name" "kafka") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
  selector:
    {{- include "praporets.selectorLabels" (dict "name" "kafka") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "praporets.labels" . | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "praporets.selectorLabels" (dict "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "praporets.selectorLabels" (dict "name" "kafka") | nindent 8 }}
    spec:
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - name: kafka
              containerPort: 9092
            # Controller-порт назовні не потрібен (quorum — localhost),
            # але задекларований для читабельності.
            - name: controller
              containerPort: 9093
          env:
            # --- KRaft: один вузол = broker і controller одночасно ---
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # --- Listener'и: одна схема, без хостової (клієнти в кластері) ---
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # --- Поведінка, як у compose.yaml ---
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        # Скоуп: дані Kafka ефемерні — топіки перестворюються при рестарті
        # пода. Свідомий трейд-оф на відміну від Postgres (PVC).
        - name: data
          emptyDir: { }
