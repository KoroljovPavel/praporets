# Перекриття для kind (`make up` подає цей файл через -f).
# (ризики): values-local зі зменшеними ресурсами, щоб стек
# вміщався на ноутбуці.
image:
  # образ вантажиться через `kind load docker-image`, у реєстрі тега local
  # немає — Never падає одразу зі зрозумілою помилкою, а не ImagePullBackOff
  pullPolicy: Never

# 04b: перекриття flagEdge.replicas=2 прибрано — масштабом edge володіє HPA
# (hpa.minReplicas=3; менше не можна: PDB minAvailable=2 заблокував би drain,
# рішення I6). Дефолтні resources уже «ноутбучні», окремих перекриттів немає.
