quarkus.application.name=flag-edge
praporets.edge.environment=dev
# --- образ: ghcr.io/koroljovpavel/praporets-flag-edge:local ---
# native-база лишається дефолтною (quay.io/quarkus/quarkus-micro-image);
# JVM-базу перекриваємо: дефолт Quarkus — openjdk-21, а байткод тут 25
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=koroljovpavel
quarkus.container-image.name=praporets-flag-edge
quarkus.container-image.tag=local
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25-runtime:latest
quarkus.http.port=8081
quarkus.grpc.clients.config.host=localhost
quarkus.grpc.clients.config.port=9090
quarkus.grpc.clients.config.plain-text=true
quarkus.grpc.server.use-separate-server=false
# evaluation-події. instance-id — випадковий на запуск (quarkus.uuid);
# у k8s його перекриє ім'я пода
kafka.bootstrap.servers=localhost:9092
praporets.edge.instance-id=flag-edge-${quarkus.uuid}
praporets.edge.events.enabled=true
praporets.edge.events.buffer-size=10000
praporets.edge.events.batch-size=500
# тестові контексти без Kafka не смітять конектами (той самий прийом, що
# fanout=false); EventsKafka-ресурс вмикає точково
%test.praporets.edge.events.enabled=false
