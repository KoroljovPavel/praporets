server:
  port: 8082

spring:
  application:
    name: analytics
  threads:
    virtual:
      enabled: true
  # 04b/I4: graceful shutdown (дефолт Boot 4) затиснутий до 15s — фаза
  # зупинки Kafka-листенерів вписується в terminationGracePeriodSeconds=30
  lifecycle:
    timeout-per-shutdown-phase: 15s
  datasource:
    url: jdbc:postgresql://localhost:5432/praporets_analytics
    username: praporets
    password: praporets
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # спільна група (репліки ділять партиції) + earliest (історія
      # цінна — analytics доганяє все, накопичене до його старту).
      # Контраст із fan-out CP: там унікальні групи + latest
      group-id: analytics
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # ack руками ПІСЛЯ коміту БД-транзакції процесора
      ack-mode: manual
  mvc:
    problemdetails:
      enabled: true

praporets:
  analytics:
    deviation:
      enabled: true
      # |actual − expected| понад це → WARN (частки, не проценти: 0.05 = 5 п.п.)
      threshold: 0.05
      # I4: менші вибірки не перевіряються — біноміальний шум
      min-sample: 100
      check-interval: 30s
      # I1: unique group на процес + earliest — compacted топік читається цілком
      group-id: analytics-rollout-${random.uuid}

management:
  # 04b: /actuator/health/{liveness,readiness} для k8s-probes (див. CP)
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
